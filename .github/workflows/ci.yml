name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies and update lockfile
        run: npm install --ignore-scripts

      - name: Bootstrap lockfile on owner branch
        if: github.event_name == 'pull_request' && github.actor == 'mojorezz-sudo' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: update npm lockfile for JOSE"
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
